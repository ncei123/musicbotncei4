<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Music MVP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search for music..." onkeypress="handleSearch(event)">
            <button id="search-button" onclick="searchMusic()">Search</button>
        </div>
        
        <div id="loading" class="hidden">Searching...</div>
        
        <div id="results-container">
            <!-- Results will be injected here -->
        </div>

        <div id="player-container" class="hidden">
            <div id="now-playing">
                <img id="now-playing-thumbnail" src="" alt="Thumbnail" class="hidden">
                <div class="now-playing-info">
                    <div id="now-playing-title"></div>
                    <div id="now-playing-artist"></div>
                </div>
            </div>
            <audio id="audio-player" controls></audio>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
